<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Invitation">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <title>Invitation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .invite-section {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .invite-wrap {
      position: relative;
      width: 100%;
      max-width: 900px;
    }

    .invite-image,
    .ticket-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .ticket-button {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 10;
      width: calc(100% - 40px);
      max-width: 420px;
      padding: 16px 24px;
      border-radius: 999px;
      background: #ffffff;
      color: #111111;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      border: 0;
      cursor: pointer;
    }

    .ticket-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.75);
    }

    .ticket-modal.is-open {
      display: flex;
    }

    .ticket-modal-content {
      position: relative;
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
    }

    .ticket-image {
      max-height: 90vh;
      object-fit: contain;
      border-radius: 12px;
    }

    .modal-close {
      position: absolute;
      top: -16px;
      right: -16px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #ffffff;
      color: #111111;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    @media (max-width: 600px) {
      .ticket-button {
        bottom: 16px;
        font-size: 16px;
      }

      .ticket-modal {
        padding: 18px;
      }

      .modal-close {
        top: -12px;
        right: -8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="invite-section" aria-label="초대장">
      <div class="invite-wrap">
        <img class="invite-image" src="invite.jpg" alt="초대장">
      </div>
    </section>

    <button class="ticket-button" type="button" id="openTicket">🎁함께할 선물 열어보기🎁</button>

    <div class="ticket-modal" id="ticketModal" aria-hidden="true">
      <div class="ticket-modal-content" role="dialog" aria-modal="true" aria-label="티켓">
        <button class="modal-close" type="button" id="closeTicket" aria-label="닫기">&times;</button>
        <img class="ticket-image" src="ticket.png" alt="티켓">
      </div>
    </div>
  </main>
  <script>
    const openTicket = document.getElementById('openTicket');
    const closeTicket = document.getElementById('closeTicket');
    const ticketModal = document.getElementById('ticketModal');

    openTicket.addEventListener('click', () => {
      ticketModal.classList.add('is-open');
      ticketModal.setAttribute('aria-hidden', 'false');
    });

    closeTicket.addEventListener('click', () => {
      ticketModal.classList.remove('is-open');
      ticketModal.setAttribute('aria-hidden', 'true');
    });

    ticketModal.addEventListener('click', (event) => {
      if (event.target === ticketModal) {
        ticketModal.classList.remove('is-open');
        ticketModal.setAttribute('aria-hidden', 'true');
      }
    });
  </script>
</body>
</html>
